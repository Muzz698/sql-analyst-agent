# Local two-service setup: FastAPI backend + Streamlit UI calling it over HTTP.
#   cp .env.example .env   # add GROQ_API_KEY
#   docker compose up --build
#   UI:  http://localhost:8501     API docs: http://localhost:8000/docs
services:
  api:
    build: .
    image: sql-analyst-agent
    command: ["uvicorn", "sql_analyst.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      CHECKPOINT_DB_PATH: /app/state/checkpoints.sqlite
    ports:
      - "8000:8000"
    volumes:
      - checkpoints:/app/state # conversation memory survives container restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  ui:
    image: sql-analyst-agent
    environment:
      API_URL: http://api:8000
      PORT: "8501"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  checkpoints:
